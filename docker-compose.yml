
services:
  postgres:
    image: postgres:14-alpine
    container_name: factory_storage_db
    environment:
      POSTGRES_DB: factory_storage
      POSTGRES_USER: factory_user
      POSTGRES_PASSWORD: factory_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - factory_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_user -d factory_storage"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: factory_storage_backend
    environment:
      DATABASE_URL: "postgresql://factory_user:factory_pass@postgres:5432/factory_storage?schema=public"
      JWT_SECRET: "your-super-secret-jwt-key-change-this-in-production"
      JWT_EXPIRES_IN: "7d"
      PORT: 5000
      NODE_ENV: "production"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - factory_network
    volumes:
      - ./server/logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    container_name: factory_frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - factory_network
    restart: unless-stopped
    environment:
    - VITE_API_URL=http://backend:5000/api


