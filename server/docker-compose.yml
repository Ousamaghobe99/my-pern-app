version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: factory_storage_db
    environment:
      POSTGRES_DB: factory_storage
      POSTGRES_USER: factory_user
      POSTGRES_PASSWORD: factory_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - factory_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_user -d factory_storage"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build: .
    container_name: factory_storage_backend
    environment:
      DATABASE_URL: "postgresql://factory_user:factory_pass@postgres:5432/factory_storage?schema=public"
      JWT_SECRET: "production-jwt-secret-change-this"
      JWT_EXPIRES_IN: "7d"
      PORT: 5000
      NODE_ENV: "production"
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - factory_network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: factory_storage_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - factory_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  factory_network:
    driver: bridge

